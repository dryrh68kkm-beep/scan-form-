name: Deploy GitHub Pages

# ห้ามเพิ่ม branch อื่นในรายการ trigger นี้อีก — ก่อนหน้านี้เคยมี branch พัฒนาอีกตัวอยู่ในรายการด้วย
# ทำให้ push ไป branch ไหนก็ตามที่ทำงานล่าสุด ชนะไปแปะทับเว็บจริงโดยไม่ขึ้นกับว่า main มีโค้ดใหม่กว่าหรือไม่
# (สาเหตุที่ UI เก่ากลับมาโผล่ทั้งที่ main อัปเดตแล้ว) ให้ main เป็นแหล่งเดียวที่ deploy ขึ้นเว็บจริงเสมอ
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
